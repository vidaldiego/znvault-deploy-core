name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      make_latest: ${{ steps.release-channel.outputs.make_latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify immutable release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Publishing requires an exact v* tag ref" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "${tag_version}" != "${package_version}" \
             || "${package_version}" != "${lock_version}" \
             || "${package_version}" != "${lock_root_version}" ]]; then
            echo "Tag/package/lock version mismatch" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          # Do NOT pass `registry-url` here. setup-node writes a stub
          # `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc when this is
          # set, which forces npm into classic Bearer-token auth and
          # bypasses OIDC trusted publishing. With Trusted Publishers
          # enabled on npm.com, npm picks up the GitHub OIDC token from
          # ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN automatically.

      - name: Update npm for OIDC support
        # OIDC Trusted Publishing requires npm >= 11.5.1. The 10.x line
        # falls back to classic Bearer-token auth and returns ENEEDAUTH
        # in this workflow. Pin to a known-good 11.x.
        run: npm install -g npm@11.10.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test packed runtime dependencies
        run: npm run test:packed

      - name: Select fenced release channel
        id: release-channel
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          case "${package_version}" in
            0.2.*)
              echo "dist_tag=dr-m4" >> "${GITHUB_OUTPUT}"
              echo "make_latest=false" >> "${GITHUB_OUTPUT}"
              ;;
            *-*)
              echo "dist_tag=next" >> "${GITHUB_OUTPUT}"
              echo "make_latest=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "dist_tag=latest" >> "${GITHUB_OUTPUT}"
              echo "make_latest=true" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Publish to npm (Trusted Publishing via OIDC)
        # --loglevel=verbose forces npm to dump the full HTTP response
        # body from the registry on failure. With Trusted Publishing,
        # npm.com's 404 responses include a JSON body explaining which
        # OIDC claim failed to match the configured publisher.
        run: npm publish --access public --provenance --tag "${{ steps.release-channel.outputs.dist_tag }}" --loglevel=verbose

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          make_latest: ${{ needs.publish.outputs.make_latest }}
